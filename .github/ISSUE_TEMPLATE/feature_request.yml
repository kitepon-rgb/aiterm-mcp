name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        aiterm keeps the PTY surface thin: **one PTY** for terminal work (currently 10 tools total — 6 PTY primitives + 3 agent launchers + 1 read-only diagnostic). SSH, containers, and REPLs are reached by nesting (`pty_send "ssh host"`), not by adding tools. Reduction quality, completion detection, safety, and platform support are all fair game.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This keeps the one-PTY model (it doesn't add a tool for a session kind that `pty_send` could reach by nesting).
