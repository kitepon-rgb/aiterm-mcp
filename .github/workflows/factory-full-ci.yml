name: Factory full CI

on:
  workflow_call:
    inputs:
      full-command:
        description: 各環境で同一に実行する製品の最終通し試験
        required: true
        type: string
      environment:
        description: all または単一の工場環境
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["macos-native","linux-native","windows-native","wsl2"]') }}
    timeout-minutes: 20
    runs-on: [self-hosted, factory, "${{ matrix.environment }}"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: full CI
        if: matrix.environment != 'windows-native'
        shell: bash
        run: ${{ inputs.full-command }}
      - name: full CI
        if: matrix.environment == 'windows-native'
        shell: C:\Progra~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: ${{ inputs.full-command }}
