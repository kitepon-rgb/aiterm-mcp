name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux (runtime prerequisite)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux (runtime prerequisite)
        run: brew install tmux
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ネイティブ Windows の Node/TS 純粋層（toWslPath・パス解決・smoke・session 名検証・reducer）を検証する。
  # WSL/tmux が無い runner では tmux 依存テストは hasTmux=false で自動 skip される。WSL ブリッジ統合経路
  # （ensureWinBridge・pipe-pane の /mnt/c 書込・settleWinLog）は手動 Windows 検証ゲートに残す（docs/03 参照）。
  # continue-on-error: 実 Windows で緑を確認できるまでは情報提供（非ブロッキング）。緑安定後に needs へ昇格する（C9）。
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: [test, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # npm Trusted Publishing (OIDC) は npm >= 11.5.1 が必要（Node 22 同梱は 10.x）
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # 認証は npmjs.com 側の Trusted Publisher 設定（GitHub Actions OIDC）。
      # トークンを一切持たない＝失効による publish 失敗（2026-07-04 の E404 実被弾）が構造的に消える。
      # C11: 既に同一 version が npm に存在する場合（tag 再 push 等）は publish をスキップ＝403 で赤くしない
      # （registry.yml の重複 idempotency と対称）。それ以外の失敗は表面化させる。
      - name: Publish to npm (skip if version already published)
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "aiterm-mcp@$ver" version >/dev/null 2>&1; then
            echo "::notice::aiterm-mcp@$ver は既に npm に存在 — publish をスキップ（idempotent）。"
            exit 0
          fi
          npm publish --provenance --access public
