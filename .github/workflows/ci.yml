name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する工場環境
        type: choice
        default: all
        options:
          - all
          - macos-native
          - linux-native
          - windows-native
          - wsl2

permissions:
  contents: read

jobs:
  full:
    uses: kitepon/dotagents/.github/workflows/factory-full-ci.yml@main
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      full-command: >-
        node --version && npm --version && npm ci && npm test

  publish:
    needs: [full]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@11.6.4
      - run: npm ci
      - name: Verify tag commit is landed on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Publish to npm (skip if version already published)
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "aiterm-mcp@$ver" version >/dev/null 2>&1; then
            echo "::notice::aiterm-mcp@$ver は既に npm に存在 — publish をスキップ（idempotent）。"
            exit 0
          fi
          npm publish --provenance --access public
