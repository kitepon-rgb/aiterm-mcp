name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux (runtime prerequisite)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux (runtime prerequisite)
        run: brew install tmux
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: [test, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance + Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # npm Trusted Publishing (OIDC) は npm >= 11.5.1 が必要（Node 22 同梱は 10.x）
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # 認証は npmjs.com 側の Trusted Publisher 設定（GitHub Actions OIDC）。
      # トークンを一切持たない＝失効による publish 失敗（2026-07-04 の E404 実被弾）が構造的に消える。
      - run: npm publish --provenance --access public
