name: Publish to MCP Registry

# Registers server.json with the Official MCP Registry
# (registry.modelcontextprotocol.io), which auto-propagates to PulseMCP and the
# GitHub MCP Registry. Auth is GitHub OIDC — no secrets needed. Keep
# server.json's version in lockstep with the published npm version before
# triggering (npm package aiterm-mcp@<version> must already exist).
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC for the io.github.kitepon-rgb/* namespace
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the Official MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          # 同一 version の再 publish はレジストリが HTTP 400
          # "invalid version: cannot publish duplicate version" を返す。これは
          # 既にそのバージョンが登録済みのときに本ワークフローが再発火した場合
          # （例: tag フローで publish 済みの版に対し release 再実行が走る）に起き、
          # レジストリ側は既に最新＝無害。この特定ケースのみ握って成功扱いにし、
          # それ以外の失敗はすべて表面化させる（黙ったフォールバックを避ける）。
          set +e
          out=$(./mcp-publisher publish 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -q "duplicate version"; then
              echo "::notice::server.json のこのバージョンは既にレジストリ登録済み — 重複を成功として扱う（idempotent）。"
              exit 0
            fi
            exit $rc
          fi
